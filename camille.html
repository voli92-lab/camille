<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Camille 💌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#ffe3ec; --bg2:#ffb8d1; --card:#fffafc; --ink:#5a2a3c; --pink:#ff6b9d; --pink-d:#e0487f; --soft:#ffc2d6; --shadow:rgba(224,72,127,.3); --chip:#fff0f5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2a1220; --bg2:#4a1838; --card:#3a1b2d; --ink:#ffe3ec; --pink:#ff7aa8; --pink-d:#d9457f; --soft:#6b2c4a; --shadow:rgba(0,0,0,.45); --chip:#4a2339;}
}
:root[data-theme="dark"]{--bg:#2a1220; --bg2:#4a1838; --card:#3a1b2d; --ink:#ffe3ec; --pink:#ff7aa8; --pink-d:#d9457f; --soft:#6b2c4a; --shadow:rgba(0,0,0,.45); --chip:#4a2339;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(circle at 15% 10%,var(--bg2),var(--bg) 65%);color:var(--ink);font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts span,.pop{position:absolute;opacity:.8}
.hearts .up{bottom:-50px;animation:up linear forwards}
.hearts .dn{top:-50px;animation:dn linear forwards}
@keyframes up{to{transform:translateY(-118vh) rotate(25deg);opacity:0}}
@keyframes dn{to{transform:translateY(118vh) rotate(-25deg);opacity:.2}}
.pop{position:fixed;z-index:9;pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),-90px) scale(1.4);opacity:0}}
.card{position:relative;z-index:1;width:min(92vw,430px);max-height:94%;overflow:auto;background:var(--card);border-radius:32px;padding:24px 22px 30px;text-align:center;box-shadow:0 18px 50px var(--shadow);border:3px solid var(--soft)}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--soft);transition:all .3s}
.dots i.on{background:var(--pink);width:26px;border-radius:6px}
.stage{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.emoji{font-size:76px;line-height:1.1;display:inline-block;animation:bob 2.2s ease-in-out infinite}
.emoji.beat{font-size:104px;animation:beat 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.22)}40%{transform:scale(1)}60%{transform:scale(1.15)}}
h1{font-size:clamp(25px,7vw,33px);margin:8px 0 6px;line-height:1.15;font-weight:800}
p{margin:0 auto 20px;font-size:18px;max-width:30ch;line-height:1.4}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;min-height:64px;flex-wrap:wrap}
button{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:999px;padding:13px 28px;cursor:pointer;color:#fff;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.main{background:var(--pink);box-shadow:0 6px 0 var(--pink-d);transition:transform .15s}
.main:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-d)}
.run{background:#a99aa2;box-shadow:0 6px 0 #8a7c84;transition:left .25s ease,top .25s ease}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--chip);color:var(--ink);border:3px solid var(--soft);border-radius:22px;padding:14px 8px;font-size:17px;line-height:1.2;display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .15s,border-color .15s}
.opt b{font-size:36px;font-weight:500}
.opt:hover{border-color:var(--pink);transform:translateY(-3px)}
.opt:active{transform:scale(.96)}
.meter{height:20px;background:var(--chip);border:3px solid var(--soft);border-radius:999px;overflow:hidden;margin:0 auto 14px;max-width:300px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),#ff9ec0);transition:width .25s}
.big{font-size:88px;background:none;box-shadow:none;padding:0;line-height:1;transition:transform .1s;color:inherit}
.big:active{transform:scale(.85)}
#pct{font-size:22px;font-weight:800;margin:6px 0 0}
#msg{min-height:26px;margin:14px 0 0;font-size:16px;opacity:.85}
.ticket{margin:4px auto 18px;background:var(--chip);border:3px dashed var(--pink);border-radius:22px;padding:14px 16px;text-align:left;font-size:18px}
.ticket div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:2px dotted var(--soft)}
.ticket div:last-child{border:0}
.ticket span{opacity:.7}
.ticket strong{text-align:right}
.btns a{text-decoration:none;display:inline-block;color:#fff;border-radius:999px;padding:13px 28px;font-weight:700;font-size:20px;background:var(--pink);box-shadow:0 6px 0 var(--pink-d)}
.say{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--chip);border:3px solid var(--soft);border-radius:18px;padding:10px 12px;resize:none;text-align:center;-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){.hearts span,.emoji,.stage,.pop{animation:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main class="card" id="card">
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="stage" id="stage"></div>
  <p id="msg" aria-live="polite"></p>
</main>
<script>
(function(){
  var DISCORD_ID=''; /* ton identifiant Discord (nombre) : https://discord.com/users/TON_ID */
  var S={step:0,act:'',love:0}, tries=0, rain=null;
  var stage=document.getElementById('stage'), msg=document.getElementById('msg'), dots=document.getElementById('dots'), box=document.getElementById('hearts');
  var lines=['Oups, le bouton a glissé 😏','Pas si vite, Camille 💕','Essaie encore… ou pas 😘','Il est timide, ce bouton 🙈','Indice : la bonne réponse est rose 💗','Même lui veut que tu dises oui 🥰'];
  var faces=['🥺','😳','🥹','😭','🫶'];
  var acts=[['🍝','Dîner aux chandelles'],['🍦','Balade et glace'],['🍿','Ciné et popcorn'],['🎁','Surprise totale']];
  var loveTxt=['Appuie sur le cœur !','Ça monte 😍','Encore, encore !','Je fonds 🫠','Presque plein 💘'];
  var set=['💗','💖','💕','💘','💝','🌸','❤️','💞'];

  function setDots(){ var h=''; for(var i=0;i<4;i++) h+='<i class="'+(i===S.step?'on':'')+'"></i>'; dots.innerHTML=h; }

  function heart(dir){
    var s=document.createElement('span');
    s.textContent=set[Math.floor(Math.random()*set.length)];
    s.className=dir;
    s.style.left=Math.random()*100+'vw';
    s.style.fontSize=(16+Math.random()*30)+'px';
    s.style.animationDuration=(5+Math.random()*6)+'s';
    box.appendChild(s);
    setTimeout(function(){ s.remove(); },11500);
  }
  function pop(x,y,n){
    for(var i=0;i<n;i++){
      var s=document.createElement('span');
      s.className='pop'; s.textContent=set[Math.floor(Math.random()*set.length)];
      s.style.left=x+'px'; s.style.top=y+'px'; s.style.fontSize=(18+Math.random()*18)+'px';
      s.style.setProperty('--dx',((Math.random()-.5)*160)+'px');
      document.body.appendChild(s);
      setTimeout(function(el){return function(){el.remove();};}(s),950);
    }
  }
  function finale(){
    for(var i=0;i<90;i++) setTimeout(function(){ heart(Math.random()<.5?'up':'dn'); },i*35);
    rain=setInterval(function(){ heart('dn'); heart('up'); heart(Math.random()<.5?'up':'dn'); },220);
  }

  function render(){
    setDots(); msg.textContent=''; tries=0;
    if(rain&&S.step<3){ clearInterval(rain); rain=null; }
    var h='';
    if(S.step===0){
      h='<div class="emoji">💌</div><h1>Camille, tu as reçu un message</h1><p>Quelqu’un pense très fort à toi et il a une question à te poser.</p><div class="btns"><button class="main" data-go="1">Ouvrir 💖</button></div>';
    }else if(S.step===1){
      h='<div class="emoji" id="face">🥺</div><h1>Camille, tu veux sortir avec moi ?</h1><p>J’ai préparé un rendez-vous rien que pour nous deux.</p><div class="btns"><button class="main" id="yes" data-go="2">Oui 💖</button><button class="run" id="no">Non</button></div>';
    }else if(S.step===2){
      h='<div class="emoji">🥰</div><h1>Parfait ! On fait quoi ?</h1><p>Choisis le programme, je m’occupe du reste.</p><div class="grid">'+acts.map(function(a){return '<button class="opt" data-act="'+a[1]+'"><b>'+a[0]+'</b>'+a[1]+'</button>';}).join('')+'</div>';
    }else if(S.step===3&&S.love<100){
      h='<h1>Dernière épreuve</h1><p>Remplis le cœur pour me montrer à quel point tu en as envie.</p><button class="big" id="heartbtn" aria-label="Remplir le cœur">❤️</button><div class="meter"><i id="bar"></i></div><div id="pct">0 %</div>';
    }else{
      var txt='C’est oui ! 💖 J’ai choisi : '+S.act+'. J’ai hâte, mon Taher d’amour ! 😘 Camille';
      var dcUrl='https://discord.com/channels/@me/1551730833335779382';
      h='<div class="emoji beat">💖</div><h1>C’est un rendez-vous, Camille !</h1><p>Tu viens de me rendre l’homme le plus heureux du monde.</p><div class="ticket"><div><span>Pour</span><strong>Camille 💕</strong></div><div><span>Programme</span><strong>'+S.act+'</strong></div><div><span>Billet</span><strong>Pour deux</strong></div><div><span>Amour</span><strong>100 % 💘</strong></div></div><p style="margin-bottom:8px;font-size:16px">Envoie-moi ta réponse sur Discord : <strong>voli_92</strong> 💌</p><textarea id="say" class="say" readonly rows="3">'+txt+'</textarea><div class="btns"><a id="dc" href="'+dcUrl+'" target="_blank" rel="noopener">Envoyer sur Discord 💬</a></div>';
      msg.textContent='Touche l’écran pour faire pleuvoir encore plus de cœurs 💗';
      finale();
    }
    stage.className='stage'; stage.innerHTML=h; void stage.offsetWidth;
    var no=document.getElementById('no'); if(no) bindRun(no);
    var hb=document.getElementById('heartbtn'); if(hb) hb.addEventListener('click',fill);
  }

  function fill(e){
    S.love=Math.min(100,S.love+9);
    document.getElementById('bar').style.width=S.love+'%';
    document.getElementById('pct').textContent=S.love+' %';
    var r=e.currentTarget.getBoundingClientRect();
    pop(r.left+r.width/2,r.top+r.height/2,3);
    msg.textContent=loveTxt[Math.min(Math.floor(S.love/21),4)];
    if(S.love>=100){ msg.textContent='Cœur plein ! 💘'; setTimeout(function(){ S.step=3; render(); },700); }
  }

  function bindRun(el){
    var moved=false;
    function dodge(e){
      e.preventDefault();
      if(!moved){ moved=true; var r=el.getBoundingClientRect(); el.style.position='fixed'; el.style.left=r.left+'px'; el.style.top=r.top+'px'; el.style.zIndex=5; }
      var w=el.offsetWidth,h=el.offsetHeight,m=12;
      el.style.left=(m+Math.random()*(window.innerWidth-w-2*m))+'px';
      el.style.top=(m+Math.random()*(window.innerHeight-h-2*m))+'px';
      msg.textContent=lines[tries%lines.length];
      var face=document.getElementById('face'); if(face) face.textContent=faces[Math.min(tries,faces.length-1)];
      tries++;
      var yes=document.getElementById('yes');
      if(yes){ yes.style.transform='scale('+Math.min(1+tries*0.12,2.2)+')'; yes.style.margin='0 '+(tries*3)+'px'; }
    }
    ['mouseenter','pointerdown','touchstart','click','focus'].forEach(function(ev){ el.addEventListener(ev,dodge,{passive:false}); });
  }

  stage.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    if(t.dataset.go){ S.step=+t.dataset.go; render(); }
    else if(t.dataset.act){ S.act=t.dataset.act; S.step=3; S.love=0; render(); }
  });
  stage.addEventListener('click',function(e){
    if(!e.target.closest('#dc')) return;
    var s=document.getElementById('say'), t=s.value;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(function(){}); }
    try{ s.select(); document.execCommand('copy'); }catch(x){}
    msg.textContent='Message copié ! Colle-le dans notre conversation 💬';
  });
  document.addEventListener('pointerdown',function(e){ if(S.step===3&&S.love>=100&&!e.target.closest('a')) pop(e.clientX,e.clientY,6); });

  for(var i=0;i<12;i++) setTimeout(function(){ heart('up'); },i*400);
  setInterval(function(){ if(S.step<3) heart('up'); },1100);
  render();
})();
</script>
</body>
</html>
